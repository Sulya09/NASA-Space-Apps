<!doctype html><html><head><meta charset="utf-8"><title>Martian Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:system-ui}#map{height:100vh;background:#222}
#panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fffe;padding:12px 16px;border-radius:8px;max-width:260px;font-size:14px}
h3{margin:0 0 6px}</style></head><body><div id="map"></div>
<div id="panel"><h3>Route summary</h3>
Distance: <b>3.53 km</b><br>Max slope: <b>4.8&deg;</b><br>
Mean slope: <b>1.9&deg;</b><br>Elevation gain: <b>64 m</b><br>
Est. walking time: <b>1.4 h</b> at 2.5 km/h<br>
Cursor: <b id="pos">-</b><br><small>Cost = slope-weighted; slopes over 25&deg; blocked. DEM: 20.0 m/pixel.</small></div>
<script>
var b=[[0,0],[1400,1400]];
var map=L.map('map',{crs:L.CRS.Simple,minZoom:-3,maxZoom:3});
var hill=L.imageOverlay('hillshade.png',b).addTo(map);
var elev=L.imageOverlay('elevation.png',b);
var slope=L.imageOverlay('slope.png',b).addTo(map);
var route=L.polyline([[520.0, 930.0], [517.0, 934.0], [515.0, 938.0], [511.0, 942.0], [507.0, 946.0], [503.0, 950.0], [499.0, 954.0], [495.0, 958.0], [491.0, 962.0], [487.0, 966.0], [483.0, 970.0], [480.0, 974.0], [479.0, 978.0], [477.0, 982.0], [475.0, 986.0], [474.0, 990.0], [471.0, 994.0], [471.0, 998.0], [468.0, 1002.0], [464.0, 1006.0], [460.0, 1010.0], [457.0, 1014.0], [453.0, 1018.0], [449.0, 1022.0], [445.0, 1026.0], [441.0, 1030.0], [438.0, 1034.0], [434.0, 1038.0], [430.0, 1042.0], [426.0, 1046.0], [422.0, 1050.0], [418.0, 1054.0], [414.0, 1056.0], [410.0, 1060.0]],{color:'#00ffcc',weight:3}).addTo(map);
L.circleMarker([520.0, 930.0],{radius:7,color:'#0f0'}).bindTooltip('Start').addTo(map);
L.circleMarker([410.0, 1060.0],{radius:7,color:'#f00'}).bindTooltip('End').addTo(map);
L.control.layers({'Hillshade':hill,'Elevation':elev},{'Slope':slope,'Route':route}).addTo(map);
map.on('mousemove',function(e){document.getElementById('pos').textContent='row '+Math.round(1400-e.latlng.lat)+', col '+Math.round(e.latlng.lng)});
map.fitBounds(b);
</script></body></html>
